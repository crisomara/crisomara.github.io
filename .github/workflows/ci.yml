name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check, build, test, link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke test the build
        run: npm test

      - name: Internal links and assets in dist (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --root-dir ${{ github.workspace }}/dist dist
          fail: true
          jobSummary: true

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
